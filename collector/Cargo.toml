[package]
name = "observer-collector"
version = "0.3.0"
edition = "2021"
description = "Collector central en Rust: ingestion de metricas de los agents, autenticacion bearer, persistencia en PostgreSQL"
license = "MIT"

# El Collector corre en el servidor central (no en el hardware de
# referencia del agent), asi que no hay presupuesto de footprint - pero se
# mantiene un criterio similar de pocas dependencias (axum + sqlx + tokio
# + serde, y poco mas).

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1